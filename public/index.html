<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelStar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="zag">Творіть разом, один квадрат раз в хвилину!</h1>
        <div class="bat">
        <button id="themeToggle" class="theme">Перемкнути тему</button>
        <button id="togglePalette" class="theme1">показати палітру</button>
        <a href="leaderboard.html" class="theme">Таблиця Лідерів</a>
        <nav class="dropdown">
            <button id="usernameButton" class="dropbtn">Username</button>
            <div class="dropdown-content">
                <a href="users/login.html">Вхід</a>
                <a href="users/register.html">Реєстрація</a>
                <a href="users/login.html" id="logoutButton">Вихід</a>
            </div>
        </nav>
    </div>
    </header>

    <main>
        
        <div id="container"></div>
        <aside id="colorPalette">
            <div id="paintedCellsCounter">Зафарбовані клітинки: 0</div>
            <div id="timeOutToPaint" class="descTime">Зачекайте:0s</div>
            <div class="color-swatch custom-color">
                <input type="color" id="customColor" name="customColor" value="#000000">
            </div>
            <div class="color-swatch" style="background-color: #ff0000;" data-color="#ff0000"></div>
            <div class="color-swatch" style="background-color: #00ff00;" data-color="#00ff00"></div>
            <div class="color-swatch" style="background-color: #0000ff;" data-color="#0000ff"></div>
            <div class="color-swatch" style="background-color: #ffff00;" data-color="#ffff00"></div>
            <div class="color-swatch" style="background-color: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color-swatch" style="background-color: #00ffff;" data-color="#00ffff"></div>
            <div class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff"></div>
            <div class="color-swatch" style="background-color: #000000;" data-color="#000000"></div>
        </aside>
        <button id="toggleChatButton" class="chat-toggle-button">Відкрити чат</button>

        <section id="chatSection" class="chat-section hidden">
            <h2>Чат</h2>
            <div id="chatLog" class="chat-log"></div>
            <input id="recipientInput" type="text" placeholder="Кому (залиште порожнім для всіх)" />
            <input id="messageInput" type="text" placeholder="Введіть повідомлення..." />
            <button id="sendButton">Відправити</button>
        </section>
    </main>

    <script src="users/themeToggle.js"></script>
    <script src="chat.js"></script>
    <script src="presets.js"></script>
    <script src="script.js"></script>
    <script src="easterEgg.js"></script>
</body>
</html>
